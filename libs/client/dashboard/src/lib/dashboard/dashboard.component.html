@let activeSessionVar = activeSession();
@if (activeSessionVar) {
  <ui-information-banner title="Information">
    <p>
      {{ activeSessionVar.name }}
      <a ui-filled-btn [routerLink]="activeSessionVar.routerLink"
        >Go to exercise
      </a>
    </p>
  </ui-information-banner>
}
