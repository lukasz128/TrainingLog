@if (isLabelChildActive()) {
  <header>
    <label [for]="inputId">
      <ng-content select="ui-label" />

      @if (isRequired()) {
        <span animate.enter="enter-animation"> &nbsp;* </span>
      }
    </label>

    <span animate.enter="enter-animation">
      <ng-content select="ui-form-error" />
    </span>
  </header>
}

<ng-content select="input[uiInput], textarea[uiInput]" />
